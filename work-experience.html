<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ประสบการณ์ทำงาน | Traisit</title><link rel="stylesheet" href="assets/css/style.css"></head><body><nav class="nav"><div class="container nav-inner"><a class="logo" href="index.html">TRAISIT<span>.</span></a><a class="btn" href="index.html">← กลับหน้าหลัก</a></div></nav><main><section><div class="container"><div class="eyebrow">Career</div><h1>ประสบการณ์ทำงาน</h1><div id="timeline" class="timeline"></div></div></section></main><script>/* โหลดข้อมูลประสบการณ์จาก JSON */fetch('experience-data.json').then(r=>r.json()).then(items=>timeline.innerHTML=items.map(x=>`<article class="timeline-item card"><div class="period">${x.period}</div><div><h3>${x.role}</h3><h4>${x.company}</h4><ul>${x.details.map(d=>`<li>${d}</li>`).join('')}</ul></div></article>`).join('')).catch(console.error);</script></body></html>
